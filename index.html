<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitalidad Herbolaria</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1a0f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: "Lato", sans-serif;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(34,85,34,0.25) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 70%, rgba(20,60,20,0.20) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    .leaf { position: fixed; opacity: 0.06; pointer-events: none; z-index: 0; }
    .leaf-1 { top: 5%; left: -4%; width: 320px; transform: rotate(-20deg); animation: sway 8s ease-in-out infinite; }
    .leaf-2 { bottom: 5%; right: -4%; width: 280px; transform: rotate(160deg); animation: sway 10s ease-in-out infinite reverse; }
    @keyframes sway {
      0%, 100% { transform: rotate(-20deg) translateY(0px); }
      50% { transform: rotate(-15deg) translateY(-12px); }
    }
    header {
      position: relative; z-index: 2;
      width: 100%; max-width: 1100px;
      padding: 48px 32px 0;
      display: flex; align-items: center; justify-content: space-between;
      animation: fadeDown 0.9s ease both;
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, #4caf50, #1b5e20);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 20px rgba(76,175,80,0.4);
    }
    .brand-name { font-family: "Playfair Display", serif; font-size: 1.3rem; color: #a5d6a7; letter-spacing: 0.04em; line-height: 1.2; }
    .brand-name span { display: block; font-size: 0.7rem; font-family: "Lato", sans-serif; letter-spacing: 0.25em; text-transform: uppercase; color: #66bb6a; font-weight: 300; }
    .tagline { font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; color: #4caf50; font-weight: 300; }
    .divider { position: relative; z-index: 2; width: 100%; max-width: 1100px; padding: 0 32px; margin: 28px 0 0; animation: fadeDown 0.9s ease 0.1s both; }
    .divider::after { content: ""; display: block; height: 1px; background: linear-gradient(to right, transparent, #2e7d32, #66bb6a, #2e7d32, transparent); }
    .image-wrap { position: relative; z-index: 2; width: 100%; max-width: 1100px; padding: 40px 32px 0; animation: fadeUp 1s ease 0.2s both; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .image-frame {
      position: relative; border-radius: 18px; overflow: hidden;
      box-shadow: 0 0 0 1px rgba(76,175,80,0.25), 0 8px 32px rgba(0,0,0,0.6), 0 0 80px rgba(27,94,32,0.3);
    }
    .image-frame::before {
      content: ""; position: absolute; inset: 0; border-radius: 18px; padding: 1.5px;
      background: linear-gradient(135deg, #4caf50, transparent 40%, #2e7d32, transparent 80%, #66bb6a);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events: none; z-index: 3; animation: borderGlow 4s linear infinite;
    }
    @keyframes borderGlow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    .image-frame img { width: 100%; display: block; border-radius: 18px; }
    footer { position: relative; z-index: 2; padding: 36px 32px 48px; text-align: center; animation: fadeUp 1s ease 0.4s both; }
    .footer-text { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: #388e3c; font-weight: 300; }
    .footer-dots { margin-top: 14px; display: flex; justify-content: center; gap: 8px; }
    .footer-dots span { width: 5px; height: 5px; border-radius: 50%; background: #2e7d32; animation: pulse 2.4s ease-in-out infinite; }
    .footer-dots span:nth-child(2) { animation-delay: 0.4s; }
    .footer-dots span:nth-child(3) { animation-delay: 0.8s; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.4); } }
  </style>
</head>
